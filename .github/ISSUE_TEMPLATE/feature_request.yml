name: 功能建议
description: 描述希望改善的具体玩家体验
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 玩家遇到的问题
      description: 注明 Web / iPad，以及在哪个具体场景发生
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望发生的行为
      description: 描述一次实际操作和想得到的反馈
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可行方案或参考
      description: 素材参考请附来源和许可
